name: ci

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
    branches: [trunk]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: brew install coreutils
        if: runner.os == 'macOS'
      - run: ./configure
      - run: make check
      - run: make sanitize

  alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache build-base bash grep sed coreutils
      - run: ./configure
      - run: make check

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y gmake coreutils
          run: |
            ./configure
            gmake check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, alpine, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./configure
      - run: make distcheck
      - run: gh release create "$GITHUB_REF_NAME" rank-*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
